# Local development infrastructure. `./gradlew :wallet-core-service:bootRun` starts it
# automatically (spring-boot-docker-compose) and wires the connection details; it can also be
# run on its own with `docker compose up -d`.
#
# Credentials here are for local development only. Real environments inject them as secrets.
name: kuropay

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kuropay
      POSTGRES_USER: kuropay
      POSTGRES_PASSWORD: kuropay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuropay -d kuropay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
