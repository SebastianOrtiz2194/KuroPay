name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running build obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test (e.g. a virtual-thread deadlock) must fail fast instead of burning 6 hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and validates the wrapper jar checksum (supply-chain check).
      - uses: gradle/actions/setup-gradle@v4

      # Compiles, runs every test (ArchUnit, unit, web slice, Testcontainers) and packages the jar.
      # ubuntu-latest runners ship with Docker, which Testcontainers needs.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
